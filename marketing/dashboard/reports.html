<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
  <title>Reports — tScrub Dashboard</title>
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
</head>
<body class="bg-white text-slate-800">

  <nav class="sticky top-0 z-50 bg-white/90 backdrop-blur border-b border-slate-200">
    <div class="mx-auto flex max-w-7xl flex-wrap items-center justify-between px-4 py-3">
      <a href="/" class="flex items-center gap-2">
        <span class="inline-flex h-8 w-8 items-center justify-center rounded-lg bg-brand-600 font-mono text-sm font-bold text-white">t</span>
        <span class="text-xl font-extrabold tracking-tight text-ink-900">tScrub</span>
      </a>
      <button data-collapse-toggle="navbar-cta" type="button" class="inline-flex items-center rounded-lg p-2 text-sm text-slate-500 hover:bg-slate-100 md:hidden" aria-controls="navbar-cta" aria-expanded="false">
        <span class="sr-only">Open menu</span>
        <svg class="h-6 w-6" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M3 5a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zM3 10a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zM3 15a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1z" clip-rule="evenodd"/></svg>
      </button>
      <div id="navbar-cta" class="hidden w-full items-center justify-between md:order-1 md:flex md:w-auto">
        <ul class="mt-4 flex flex-col gap-2 font-medium md:mt-0 md:flex-row md:items-center md:gap-6">
          <li><a href="/docs" class="text-slate-600 hover:text-ink-900">Docs</a></li>
          <li><a href="/download" class="text-slate-600 hover:text-ink-900">Pricing</a></li>
          <li><a href="/faq" class="text-slate-600 hover:text-ink-900">FAQ</a></li>
          <li><a href="/contact" class="text-slate-600 hover:text-ink-900">Contact</a></li>
        </ul>
        <a href="/login" id="nav-cta" class="mt-4 inline-flex items-center rounded-lg bg-brand-600 px-4 py-2 text-sm font-semibold text-white hover:bg-brand-700 md:mt-0 md:ml-6">Sign in</a>
      </div>
    </div>
  </nav>

  <section class="mx-auto w-full max-w-5xl px-4 py-10">
    <h1 class="text-3xl font-extrabold tracking-tight text-ink-900">Dashboard</h1>
    <div id="dashboard-nav" class="mt-4"></div>

    <div class="mt-8 rounded-2xl border border-slate-200 bg-slate-50 p-6">
      <h2 class="text-lg font-bold text-ink-900">SMART data reports</h2>
      <p class="mt-1 text-sm text-slate-600">Per-drive details and pre/post-wipe SMART data for every certificate. Pick one to drill down.</p>
      <div id="cert-list" class="mt-4"></div>
      <div id="cert-detail" class="mt-4 hidden"></div>
    </div>
  </section>

  <footer class="bg-ink-900 text-slate-400">
    <div class="mx-auto flex max-w-7xl flex-col items-center justify-between gap-4 px-4 py-8 text-sm md:flex-row">
      <div class="flex items-center gap-2">
        <span class="inline-flex h-6 w-6 items-center justify-center rounded bg-brand-600 font-mono text-xs font-bold text-white">t</span>
        <span class="font-semibold text-white">tScrub</span>
      </div>
      <ul class="flex flex-wrap justify-center gap-6">
        <li><a href="/privacy" class="hover:text-white">Privacy</a></li>
        <li><a href="/terms" class="hover:text-white">Terms</a></li>
        <li><a href="/contact" class="hover:text-white">Contact</a></li>
      </ul>
      <p class="text-xs">© 2026 tScrub. Made in England.</p>
    </div>
  </footer>

  <script type="module" src="/src/main.js"></script>
  <script>
    (function () {
      function el(tag, cls, text) {
        var n = document.createElement(tag);
        if (cls) n.className = cls;
        if (text != null) n.textContent = text;
        return n;
      }

      fetch('/api/me').then(function (r) {
        if (r.status === 401) { window.location.href = '/login?next=/dashboard/reports'; return Promise.reject(); }
        return r.json();
      }).then(function () {
        loadCerts();
        var m = /[?&]cert=([^&]+)/.exec(window.location.search);
        if (m) loadCertDetail(decodeURIComponent(m[1]));
      });

      function loadCerts() {
        fetch('/api/certs').then(function (r) { return r.json(); }).then(function (d) {
          var list = document.getElementById('cert-list');
          list.innerHTML = '';
          var rows = d.certs || [];
          if (!rows.length) {
            var empty = el('p', 'text-sm text-slate-500', 'No certificates yet. Generate one from the ');
            var a = el('a', 'font-semibold text-brand-700 hover:underline', 'Certify');
            a.href = '/dashboard/certify';
            empty.appendChild(a);
            empty.appendChild(el('span', 'text-sm text-slate-500', ' page, or push reports from an appliance.'));
            list.appendChild(empty);
            return;
          }
          var table = el('table', 'w-full border-collapse text-sm');
          var hr = el('tr');
          ['Certificate ID', 'Chain of custody', 'Devices', 'Issued', 'PDF'].forEach(function (h) {
            hr.appendChild(el('th', 'border-b border-slate-200 px-3 py-2 text-left text-xs font-semibold uppercase text-slate-500', h));
          });
          table.appendChild(hr);
          rows.forEach(function (c) {
            var tr = el('tr');
            var td = el('td', 'border-b border-slate-100 px-3 py-2');
            var a = el('button', 'font-mono text-xs font-semibold text-brand-700 hover:underline', c.cert);
            a.addEventListener('click', function () { loadCertDetail(c.cert); });
            td.appendChild(a);
            tr.appendChild(td);
            tr.appendChild(el('td', 'border-b border-slate-100 px-3 py-2', c.cocid));
            tr.appendChild(el('td', 'border-b border-slate-100 px-3 py-2', String(c.devices)));
            tr.appendChild(el('td', 'border-b border-slate-100 px-3 py-2', (c.issued || '').slice(0, 10)));
            var pdfTd = el('td', 'border-b border-slate-100 px-3 py-2');
            if (c.has_pdf) {
              var dl = el('a', 'text-xs font-semibold text-brand-700 hover:underline', 'Download');
              dl.href = '/api/certs/' + encodeURIComponent(c.cert) + '/download';
              pdfTd.appendChild(dl);
            } else {
              pdfTd.appendChild(el('span', 'text-xs text-slate-400', '—'));
            }
            tr.appendChild(pdfTd);
            table.appendChild(tr);
          });
          list.appendChild(table);
        });
      }

      function loadCertDetail(certId) {
        var box = document.getElementById('cert-detail');
        box.classList.remove('hidden');
        box.innerHTML = 'Loading…';
        fetch('/api/certs/' + encodeURIComponent(certId)).then(function (r) { return r.json(); }).then(function (d) {
          var c = d.cert;
          box.innerHTML = '';
          var head = el('div', 'flex flex-wrap items-center justify-between gap-2');
          head.appendChild(el('div', 'text-sm font-bold text-ink-900', c.cert + ' · CoC ' + c.cocid));
          var actions = el('div', 'flex items-center gap-3');
          var verify = el('a', 'text-xs font-semibold text-brand-700 hover:underline', 'Public verification ↗');
          verify.href = '/verify?cert=' + c.cert;
          verify.target = '_blank';
          actions.appendChild(verify);
          if (c.has_pdf) {
            var dl = el('a', 'text-xs font-semibold text-brand-700 hover:underline', 'Download PDF');
            dl.href = '/api/certs/' + encodeURIComponent(c.cert) + '/download';
            actions.appendChild(dl);
          }
          head.appendChild(actions);
          box.appendChild(head);

          var drives = c.drives || [];
          if (!drives.length) { box.appendChild(el('p', 'mt-2 text-sm text-slate-500', 'No per-drive data recorded for this certificate.')); return; }

          var wrap = el('div', 'mt-3 overflow-x-auto');
          var table = el('table', 'w-full border-collapse text-xs');
          var hr = el('tr');
          ['Device','Type','Model','Serial','Method','Certification','Status','SMART','Temp °C','Power-on h','Cycles','Used %','Spare','TBW','SMART post','Temp post','POH post'].forEach(function (h) {
            hr.appendChild(el('th', 'border-b border-slate-200 px-2 py-1.5 text-left font-semibold uppercase text-slate-500', h));
          });
          table.appendChild(hr);
          drives.forEach(function (d) {
            var r = el('tr');
            [d.device, d.type, d.model, d.serial, d.method, d.certification, d.final_status, d.smart, d.tempc, d.poweronhours, d.powercycles, d.pctused, d.availspare, d.tbw_tb, d.smartpost, d.tempcpost, d.poweronhourspost].forEach(function (v) {
              r.appendChild(el('td', 'border-b border-slate-100 px-2 py-1.5', v || '—'));
            });
            table.appendChild(r);
          });
          wrap.appendChild(table);
          box.appendChild(wrap);
        });
      }
    })();
  </script>
</body>
</html>
