<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
  <title>Account — tScrub Dashboard</title>
  <meta http-equiv="refresh" content="0; url=/dashboard/settings" />
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
</head>
<body class="bg-white text-slate-800">
  <script>location.replace('/dashboard/settings');</script>

  <nav class="sticky top-0 z-50 bg-white/90 backdrop-blur border-b border-slate-200">
    <div class="mx-auto flex max-w-7xl flex-wrap items-center justify-between px-4 py-3">
      <a href="/" class="flex items-center gap-2">
        <span class="inline-flex h-8 w-8 items-center justify-center rounded-lg bg-brand-600 font-mono text-sm font-bold text-white">t</span>
        <span class="text-xl font-extrabold tracking-tight text-ink-900">tScrub</span>
      </a>
      <button data-collapse-toggle="navbar-cta" type="button" class="inline-flex items-center rounded-lg p-2 text-sm text-slate-500 hover:bg-slate-100 md:hidden" aria-controls="navbar-cta" aria-expanded="false">
        <span class="sr-only">Open menu</span>
        <svg class="h-6 w-6" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M3 5a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zM3 10a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zM3 15a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1z" clip-rule="evenodd"/></svg>
      </button>
      <div id="navbar-cta" class="hidden w-full items-center justify-between md:order-1 md:flex md:w-auto">
        <ul class="mt-4 flex flex-col gap-2 font-medium md:mt-0 md:flex-row md:items-center md:gap-6">
          <li><a href="/docs" class="text-slate-600 hover:text-ink-900">Docs</a></li>
          <li><a href="/download" class="text-slate-600 hover:text-ink-900">Pricing</a></li>
          <li><a href="/faq" class="text-slate-600 hover:text-ink-900">FAQ</a></li>
          <li><a href="/contact" class="text-slate-600 hover:text-ink-900">Contact</a></li>
        </ul>
        <a href="/login" id="nav-cta" class="mt-4 inline-flex items-center rounded-lg bg-brand-600 px-4 py-2 text-sm font-semibold text-white hover:bg-brand-700 md:mt-0 md:ml-6">Sign in</a>
      </div>
    </div>
  </nav>

  <section class="mx-auto w-full max-w-5xl px-4 py-10">
    <h1 class="text-3xl font-extrabold tracking-tight text-ink-900">Dashboard</h1>
    <div id="dashboard-nav" class="mt-4"></div>

    <div class="mt-8 rounded-2xl border border-slate-200 bg-slate-50 p-6">
      <h2 class="text-lg font-bold text-ink-900">Account</h2>
      <div id="user-detail" class="mt-3 text-sm text-slate-500">Loading…</div>
      <button id="sign-out" class="mt-4 rounded-lg border border-red-300 bg-white px-4 py-2.5 text-sm font-semibold text-red-600 hover:bg-red-50">Sign out</button>
    </div>
  </section>

  <footer class="bg-ink-900 text-slate-400">
    <div class="mx-auto flex max-w-7xl flex-col items-center justify-between gap-4 px-4 py-8 text-sm md:flex-row">
      <div class="flex items-center gap-2">
        <span class="inline-flex h-6 w-6 items-center justify-center rounded bg-brand-600 font-mono text-xs font-bold text-white">t</span>
        <span class="font-semibold text-white">tScrub</span>
      </div>
      <ul class="flex flex-wrap justify-center gap-6">
        <li><a href="/privacy" class="hover:text-white">Privacy</a></li>
        <li><a href="/terms" class="hover:text-white">Terms</a></li>
        <li><a href="/contact" class="hover:text-white">Contact</a></li>
      </ul>
      <p class="text-xs">© 2026 tScrub. Made in England.</p>
    </div>
  </footer>

  <script type="module" src="/src/main.js"></script>
  <script>
    (function () {
      function el(tag, cls, text) {
        var n = document.createElement(tag);
        if (cls) n.className = cls;
        if (text != null) n.textContent = text;
        return n;
      }
      fetch('/api/me').then(function (r) {
        if (r.status === 401) { window.location.href = '/login?next=/dashboard/user'; return Promise.reject(); }
        return r.json();
      }).then(function (d) {
        var u = d.user;
        var box = document.getElementById('user-detail');
        box.innerHTML = '';
        var rows = [
          ['Email', u.email],
          ['Name', u.name || '—'],
          ['Account type', u.account_type === 'company' ? 'Company' : 'Personal'],
          ['Company', u.company_name || '—'],
          ['Role', u.role],
          ['Email verified', u.email_verified ? 'Yes' : 'No'],
          ['Joined', (u.created_at || '').slice(0, 10)],
          ['Last login', (u.last_login_at || '—').slice(0, 16)]
        ];
        rows.forEach(function (r) {
          var row = el('div', 'flex flex-wrap gap-2 border-b border-slate-100 py-2');
          row.appendChild(el('span', 'w-32 font-semibold text-ink-900', r[0]));
          row.appendChild(el('span', 'text-slate-600', r[1]));
          box.appendChild(row);
        });
      });

      document.getElementById('sign-out').addEventListener('click', function () {
        fetch('/api/csrf').then(function (r) { return r.json(); }).then(function (d) {
          return fetch('/api/logout', { method: 'POST', headers: { 'X-CSRF-Token': (d && d.csrf) || '' } });
        }).then(function () { window.location.href = '/'; });
      });
    })();
  </script>
</body>
</html>
