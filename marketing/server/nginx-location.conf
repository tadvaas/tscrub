# Paste this INSIDE the "server { ... }" block for tscrub.com
# in /etc/nginx/sites-available/tscrub.conf (above the "location /" block),
# then run:  sudo nginx -t && sudo systemctl reload nginx
location = /submit {
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /home/oxwet/webs/tscrub-form/submit.php;
    fastcgi_pass unix:/run/php/php8.3-fpm.sock;
}

# Allow direct downloads of the tScrub artifact. The ^~ prefix beats the
# "\.sh$ deny all" rule in snippets/security.conf.
location ^~ /downloads/ {
    try_files $uri =404;
    add_header Content-Disposition "attachment";
}

# Certificate of Destruction generator (upload + PDF).
location = /api/certify {
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /home/oxwet/webs/tscrub-form/certify.php;
    fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    client_max_body_size 8m;
}

# Certificate verification page (lookup by certificate ID).
location = /verify {
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /home/oxwet/webs/tscrub-form/verify.php;
    fastcgi_pass unix:/run/php/php8.3-fpm.sock;
}

# JSON API (auth, dashboard, admin, licences). The exact-match /api/certify
# block above still wins for the certificate upload endpoint.
location /api/ {
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /home/oxwet/webs/tscrub-form/api.php;
    fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    client_max_body_size 8m;
}
