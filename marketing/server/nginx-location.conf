# Paste this INSIDE the "server { ... }" block for tscrub.com
# in /etc/nginx/sites-available/tscrub.conf (above the "location /" block),
# then run:  sudo nginx -t && sudo systemctl reload nginx

# Dashboard pages must not be heuristically cached by the BROWSER. They are
# plain HTML with no cache-control, so a browser is free to keep yesterday's copy
# and run yesterday's inline script — which is exactly how a shipped button
# "is not there" (Cloudflare does not cache them: cf-cache-status: DYNAMIC).
# `no-cache` still allows a conditional revalidation, so an unchanged page costs
# a 304, not a reload. The hashed /assets/* stay immutable and are busted by the
# ?v= on each page's <script> tag.
location ^~ /dashboard/ {
    try_files $uri $uri/ =404;
    add_header Cache-Control "no-cache, must-revalidate";
}
location = /submit {
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /home/oxwet/webs/tscrub-form/submit.php;
    fastcgi_pass unix:/run/php/php8.3-fpm.sock;
}

# Allow direct downloads of the tScrub artifact. The ^~ prefix beats the
# "\.sh$ deny all" rule in snippets/security.conf.
location ^~ /downloads/ {
    try_files $uri =404;
    add_header Content-Disposition "attachment";
}

# Defence in depth: the PHP backend (config.json, vendor.key, sign.key,
# cert PDFs) lives in /home/oxwet/webs/tscrub-form/, outside the site docroot.
# If the docroot is ever broadened, this keeps those files unservable.
location ^~ /tscrub-form/ {
    deny all;
    return 404;
}

# Certificate verification page (lookup by certificate ID).
location = /verify {
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /home/oxwet/webs/tscrub-form/verify.php;
    fastcgi_pass unix:/run/php/php8.3-fpm.sock;
}

# JSON API (auth, dashboard, admin, licences, report upload, cert generation).
location /api/ {
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /home/oxwet/webs/tscrub-form/api.php;
    fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    client_max_body_size 8m;
    # The MDM endpoint (POST /api/mdm/autopilot) polls Microsoft Graph and can
    # take up to ~240 s (async Autopilot import); the nginx default of 60 s
    # would cut the response short.
    fastcgi_read_timeout 300s;
}
