# tScrub — edge redirects for Search Console hygiene (roadmap/marketing.md §1)
#
# Target host config: /etc/nginx/sites-available/tscrub.conf (root-owned; user
# `oxwet` has no sudo — apply these as root). Companion file:
# marketing/server/nginx-location.conf (the PHP/API routes).
#
# Two parts:
#   PART A  HTTP -> HTTPS (and www -> apex)   — server-block level
#   PART B  retired-page 301s                 — location level (443 server)
#
# Apply, then verify:
#   sudo nginx -t && sudo systemctl reload nginx
#   curl -s -o /dev/null -w "%{http_code} %{redirect_url}\n" http://tscrub.com/
#
# WHY: GSC has both http:// and https:// URLs indexed (http://… returns 200),
# and /how-it-works, /getting-started, /updates 404 while still holding
# impressions. 301s consolidate those signals instead of splitting/dropping them.


###############################################################################
# PART A — HTTP -> HTTPS
#
# ⚠️ DO NOT APPLY THIS ON THE CURRENT HOST. Measured 2026-10-22:
#   * the tscrub.com server block has NO `listen 443` at all, and there is no
#     certificate on the box — the origin is reached over PLAIN HTTP;
#   * tScrub is fronted by Cloudflare in **Flexible** SSL mode, which means the
#     CDN fetches from the origin on port 80.
#
# Under that topology an origin-level `return 301 https://…` matches the CDN's
# own fetch, so every request becomes http -> 301 https -> CDN fetches http ->
# 301 https … i.e. ERR_TOO_MANY_REDIRECTS for every visitor. The public
# http->https redirect belongs at the edge: Cloudflare → SSL/TLS → Edge
# Certificates → **Always Use HTTPS** (no root, no reload, no outage).
#
# This block becomes correct only if the origin gains its own TLS listener and
# the CDN is moved to Full (strict). Until then, apply PART B only.
#
# Original guidance, kept for that future case:
# If a `listen 80` server block for tscrub.com already exists, REPLACE ITS BODY
# with the block below (keep its listen/server_name lines). If there is no
# port-80 block, add this whole block. $request_uri preserves path + query.
#
# NOTE: use the location form (not a bare server-level `return 301`) so ACME
# HTTP-01 renewals still work. If you renew certificates via DNS-01 instead,
# you can collapse this to a single `return 301 https://tscrub.com$request_uri;`
# at server level.
###############################################################################

server {
    listen      80;
    listen      [::]:80;
    server_name tscrub.com www.tscrub.com;

    # Keep ACME HTTP-01 challenges reachable over plain HTTP. Set `root` to your
    # certbot webroot, or delete this block if you renew via DNS-01.
    location ^~ /.well-known/acme-challenge/ {
        root         /var/www/html;
        default_type "text/plain";
    }

    # Everything else -> HTTPS (apex host, path preserved).
    location / {
        return 301 https://tscrub.com$request_uri;
    }
}

# If the HTTPS (443) block also answers on www.tscrub.com, force apex there too
# by adding this inside that block (after its server_name line):
#
#     if ($host = www.tscrub.com) { return 301 https://tscrub.com$request_uri; }


###############################################################################
# PART B — retired-page 301s
#
# Paste INSIDE the `server { ... }` 443 block (alongside nginx-location.conf).
# `location =` is an exact match, so it always wins over `location /`.
# Adjust targets if a different destination reads better.
###############################################################################

location = /how-it-works    { return 301 https://tscrub.com/docs; }   # was a live page; 404 now
location = /getting-started { return 301 https://tscrub.com/docs; }   # docs carries "Get started"
location = /updates         { return 301 https://tscrub.com/docs; }   # release notes folded into docs/CHANGELOG

# /certify currently returns a static 200 meta-refresh stub. Uncomment to make
# it a real edge 301 (cleaner for crawlers):
# location = /certify { return 301 https://tscrub.com/dashboard/certificates; }
#
# NOTE the dashboard redirect stubs (/dashboard/reports, /dashboard/certify,
# /dashboard/licence, /dashboard/settings) are already `noindex` + robots-
# disallowed and handled client-side — no edge rule needed.
